services:
  - type: web
    name: ghani-shop
    runtime: node
    plan: starter            # a persistent disk requires a paid plan
    buildCommand: echo "no build"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        sync: false          # set it in the Render dashboard
    disk:
      name: ghani-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
