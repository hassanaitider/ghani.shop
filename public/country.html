<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghani Shop</title>
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" type="image/png" href="/media/logo-icon.png">
  <link rel="stylesheet" href="/home.css">
</head>
<body>
<header class="bar">
  <a class="logo" href="/" aria-label="Ghani Shop"><img class="logo__img" src="/media/logo.png" alt="Ghani Shop"></a>
  <div class="bar__tools">
    <a class="chip chip--link" href="/" id="changeCountry" data-i18n="country.change"></a>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" class="seg__b" data-lang="fr">FR</button>
      <button type="button" class="seg__b" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main class="wrap wrap--wide">
  <h1 id="title"></h1>
  <p class="lead" data-i18n="country.sub"></p>

  <nav class="chips" id="cats" aria-label="Categories"></nav>
  <div class="products" id="products" aria-live="polite"></div>
  <p class="empty" id="empty" hidden data-i18n="country.empty"></p>
</main>

<footer class="foot">
  <span>© <span id="year"></span> Ghani Shop</span>
  <a href="/admin" data-i18n="foot.admin"></a>
</footer>

<script src="/shared.js"></script>
<script src="/i18n.js"></script>
<script src="/country.js"></script>
</body>
</html>
