<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Ghani Shop — Admin</title>
  <link rel="icon" type="image/png" href="/media/logo-icon.png">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>

<!-- LOGIN -->
<main class="login" id="login">
  <form class="login__card" id="loginForm">
    <div class="brand"><img class="brand__img" src="/media/logo.png" alt="Ghani Shop"></div>
    <h1 data-i18n="a.login.title"></h1>
    <label><span data-i18n="a.login.pw"></span>
      <input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <p class="error" id="loginErr" hidden></p>
    <button class="btn btn--primary" type="submit" data-i18n="a.login.btn"></button>
    <div class="seg seg--center">
      <button type="button" class="seg__b" data-lang="fr">FR</button>
      <button type="button" class="seg__b" data-lang="en">EN</button>
    </div>
  </form>
</main>

<!-- DASHBOARD -->
<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand"><img class="brand__img" src="/media/logo.png" alt="Ghani Shop"></div>
    <nav class="tabs" id="tabs" role="tablist">
      <button type="button" class="tab is-active" role="tab" data-tab="dashboard" data-i18n="a.tab.dashboard"></button>
      <button type="button" class="tab" role="tab" data-tab="orders" data-i18n="a.tab.orders"></button>
      <button type="button" class="tab" role="tab" data-tab="countries" data-i18n="a.tab.countries"></button>
      <button type="button" class="tab" role="tab" data-tab="categories" data-i18n="a.tab.categories"></button>
      <button type="button" class="tab" role="tab" data-tab="products" data-i18n="a.tab.products"></button>
    </nav>
    <div class="top__tools">
      <div class="seg">
        <button type="button" class="seg__b" data-lang="fr">FR</button>
        <button type="button" class="seg__b" data-lang="en">EN</button>
      </div>
      <button class="btn" id="refresh" type="button" data-i18n="a.refresh"></button>
      <button class="btn" id="export" type="button" data-i18n="a.export"></button>
      <button class="btn btn--dark" id="logout" type="button" data-i18n="a.logout"></button>
    </div>
  </header>

  <div class="wrap">
    <!-- Dashboard -->
    <div class="pane" data-pane="dashboard">
      <section class="kpis" id="kpis"></section>

      <section class="grid2">
        <div class="panel">
          <h2 data-i18n="a.chart.title"></h2>
          <div id="chart" class="chart"></div>
        </div>
        <div class="panel">
          <h2 data-i18n="a.regions.title"></h2>
          <div id="regions"></div>
        </div>
      </section>

      <section class="grid2 grid2--wide">
        <div class="panel">
          <h2 data-i18n="a.countries.title"></h2>
          <div class="tablewrap">
            <table class="table" id="countryTable">
              <thead><tr>
                <th data-i18n="a.col.country"></th><th data-i18n="a.col.currency"></th>
                <th class="num" data-i18n="a.col.orders"></th><th class="num" data-i18n="a.col.local"></th><th class="num" data-i18n="a.col.eur"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="panel">
          <h2 data-i18n="a.set.title"></h2>
          <form id="settings">
            <div class="lbl"><span data-i18n="a.set.rates"></span></div>
            <div class="rates" id="rates"></div>
            <p class="muted small" data-i18n="a.set.hint"></p>
            <button class="btn btn--primary" type="submit" data-i18n="a.set.save"></button>
          </form>
        </div>
      </section>
    </div>

    <!-- Orders, grouped by destination country -->
    <div class="pane" data-pane="orders" hidden>
      <section class="panel">
        <div class="panel__head">
          <h2 data-i18n="a.orders.title"></h2>
          <span class="muted small" id="shown"></span>
        </div>
        <div class="filters">
          <input type="search" id="fSearch" data-i18n-ph="a.f.search">
          <select id="fStatus"></select>
          <select id="fRegion"></select>
          <select id="fCountry"></select>
        </div>
      </section>
      <div id="ordersGroups" class="groups"></div>
    </div>

    <!-- Countries & per-country catalogs -->
    <div class="pane" data-pane="countries" hidden>
      <section class="panel">
        <div class="panel__head">
          <h2 data-i18n="a.cty.title"></h2>
          <button class="btn btn--primary" id="addCountry" type="button" data-i18n="a.cty.add"></button>
        </div>
        <div class="tablewrap">
          <table class="table" id="countriesTable">
            <thead><tr>
              <th data-i18n="a.col.country"></th><th data-i18n="a.cty.page"></th><th data-i18n="a.col.currency"></th>
              <th class="num" data-i18n="a.cty.products"></th><th class="num" data-i18n="a.col.orders"></th>
              <th data-i18n="a.cty.status"></th><th></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- Categories: an independent list per country -->
    <div class="pane" data-pane="categories" hidden>
      <section class="panel">
        <div class="panel__head"><h2 data-i18n="a.cat.title"></h2></div>
        <label class="lbl lbl--inline"><span data-i18n="a.pick.country"></span><select id="catCountry"></select></label>
        <div id="catBody"></div>
      </section>
    </div>

    <!-- Products: country first, then that country's categories -->
    <div class="pane" data-pane="products" hidden>
      <section class="panel">
        <div class="panel__head">
          <h2 data-i18n="a.prod.list"></h2>
          <button class="btn btn--primary" id="addProduct" type="button" data-i18n="a.prod.add" disabled></button>
        </div>
        <label class="lbl lbl--inline"><span data-i18n="a.pick.country"></span><select id="prodCountry"></select></label>
        <div id="prodBody"></div>
      </section>
    </div>
  </div>
</div>

<!-- ORDER DETAIL -->
<dialog id="detail" class="detail">
  <div id="detailBody"></div>
</dialog>

<!-- COUNTRY EDITOR -->
<dialog id="cdlg" class="detail detail--wide">
  <div id="cdlgBody"></div>
</dialog>

<!-- PRODUCT EDITOR -->
<dialog id="pdlg" class="detail detail--wide">
  <div id="pdlgBody"></div>
</dialog>

<input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>

<div class="toast" id="toast" hidden></div>

<script src="/shared.js"></script>
<script src="/i18n.js"></script>
<script src="/admin.js"></script>
</body>
</html>
